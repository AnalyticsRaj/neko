services:
  neko:
    # Chromium works best for WhatsApp Web / Instagram / Telegram.
    # For Firefox instead, change to: ghcr.io/m1k1o/neko/firefox:3
    image: ghcr.io/m1k1o/neko/chromium:3
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "9012:8080"                      # the web UI  -> http://YOUR-IP:9012
      - "52000-52100:52000-52100/udp"    # WebRTC media (screen/audio)
    environment:
      NEKO_DESKTOP_SCREEN: "1280x720@30"
      NEKO_MEMBER_PROVIDER: "multiuser"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_USER_PASSWORD}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD}"
      NEKO_WEBRTC_EPR: "52000-52100"
      NEKO_WEBRTC_NAT1TO1: "${NEKO_PUBLIC_IP}"
      NEKO_WEBRTC_ICELITE: "true"
